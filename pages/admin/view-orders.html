<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Orders - DressLux Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="admin-dashboard.html" class="navbar-logo">DressLux Admin</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="add-product.html">Add Product</a></li>
        <li><a href="view-products.html">Products</a></li>
        <li><a href="view-orders.html" class="active">Orders</a></li>
        <li><a href="view-customers.html">Customers</a></li>
      </ul>

      <div class="navbar-icons">
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Orders Management -->
  <div class="container">
    <div class="admin-container">
      <div class="admin-controls" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:1rem; flex-wrap:wrap;">
        <div style="display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
          <label for="month-filter" style="display:flex; align-items:center; gap:0.5rem; font-weight:600;">
            Show orders for:
            <select id="month-filter" style="padding:0.75rem 1rem; border:1px solid #ccc; border-radius:8px; background:#fff; color:#333;">
              <option value="All">All Months</option>
              <option value="0">January</option>
              <option value="1">February</option>
              <option value="2">March</option>
              <option value="3">April</option>
              <option value="4">May</option>
              <option value="5">June</option>
              <option value="6">July</option>
              <option value="7">August</option>
              <option value="8">September</option>
              <option value="9">October</option>
              <option value="10">November</option>
              <option value="11">December</option>
            </select>
          </label>
          <button id="refresh-orders-btn" class="refresh-btn" style="padding:0.75rem 1rem; border:none; border-radius:8px; background:#333; color:#fff; cursor:pointer;">Refresh Orders</button>
        </div>
        <div id="auto-refresh-status" style="font-size:0.95rem; color:#555;">Auto-refresh every 20s</div>
      </div>
      <div id="orders-table-container">
        <!-- Orders table will be rendered here -->
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("active");
    });

    // Initialize page
    document.addEventListener("DOMContentLoaded", initAdminOrdersPage);
  </script>
</body>
</html>
