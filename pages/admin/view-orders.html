<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/navbar.css">

</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="admin-dashboard.html" class="navbar-logo">DressLux Admin</a>

      <div class="hamburger" id="hamburger">

        <li><a href="view-orders.html" class="active">Orders</a></li>

    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");

    // Initialize page
    document.addEventListener("DOMContentLoaded", initAdminOrdersPage);
