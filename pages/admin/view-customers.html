<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Customers - DressLux Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="admin-dashboard.html" class="navbar-logo">DressLux Admin</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="add-product.html">Add Product</a></li>
        <li><a href="view-products.html">Products</a></li>
        <li><a href="view-orders.html">Orders</a></li>
        <li><a href="view-customers.html" class="active">Customers</a></li>
      </ul>

      <div class="navbar-icons">
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Customers Management -->
  <div class="container">
    <div class="admin-container">
      <div style="display: flex; gap: 1rem; align-items: flex-start;">
        <div style="flex: 1;">
          <div id="customers-table-container">
            <!-- Customers table will be rendered here -->
          </div>
        </div>
        <div id="customer-sidepanel" style="width: 360px;">
          <!-- Side panel for create/edit customer -->
          <div class="card" style="padding: 1rem;">
            <h3>Create Customer</h3>
            <form id="create-customer-form">
              <div class="form-group">
                <label for="cust-name">Name</label>
                <input id="cust-name" type="text" required />
              </div>
              <div class="form-group">
                <label for="cust-email">Email</label>
                <input id="cust-email" type="email" required />
              </div>
              <div class="form-group">
                <label for="cust-phone">Phone</label>
                <input id="cust-phone" type="tel" />
              </div>
              <div class="form-group">
                <label for="cust-city">City</label>
                <input id="cust-city" type="text" />
              </div>
              <div class="form-group">
                <label for="cust-pincode">Pincode</label>
                <input id="cust-pincode" type="text" />
              </div>
              <div class="form-group">
                <label for="cust-address">Address</label>
                <textarea id="cust-address" rows="3"></textarea>
              </div>
              <button type="submit" class="btn btn-primary" style="width:100%;">Create Customer</button>
            </form>
            <p style="font-size:0.85rem; color:var(--gray); margin-top:0.5rem;">A temporary password will be assigned; customer should change it later.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("active");
    });

    // Initialize page
    document.addEventListener("DOMContentLoaded", initAdminCustomersPage);
  </script>
</body>
</html>
