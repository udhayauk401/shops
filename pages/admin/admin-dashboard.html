<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - DressLux</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/admin.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="admin-dashboard.html" class="navbar-logo">DressLux Admin</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="admin-dashboard.html" class="active">Dashboard</a></li>
        <li><a href="add-product.html">Add Product</a></li>
        <li><a href="view-orders.html">Orders</a></li>
        <li><a href="view-customers.html">Customers</a></li>
      </ul>

      <div class="navbar-icons">
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Admin Dashboard -->
  <div class="container">
    <div class="admin-container">
      <div class="admin-header">
        <h1>Admin Dashboard</h1>
        <p>Manage your DressLux store and monitor key metrics</p>
      </div>

      <div class="stats-grid" id="stats-container">
        <!-- Stats will be rendered here -->
      </div>

      <div class="quick-actions">
        <a href="add-product.html" class="action-btn">
          <span class="action-btn-icon">➕</span>
          <span class="action-btn-text">Add New Product</span>
        </a>
        <a href="view-orders.html" class="action-btn">
          <span class="action-btn-icon">📦</span>
          <span class="action-btn-text">View All Orders</span>
        </a>
        <a href="view-customers.html" class="action-btn">
          <span class="action-btn-icon">👥</span>
          <span class="action-btn-text">View Customers</span>
        </a>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/admin.js"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("active");
    });

    // Initialize page
    document.addEventListener("DOMContentLoaded", initAdminDashboard);
  </script>
</body>
</html>
