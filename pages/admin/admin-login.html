<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - DressLux</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>DressLux Admin</h1>
      <p class="subtitle">Admin Portal Login</p>

      <form class="auth-form" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="admin@dresslux.com" required>
          <div class="error-msg"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
          <div class="error-msg"></div>
        </div>

        <button type="submit" class="submit-btn">Admin Login</button>
      </form>

      <div class="auth-footer">
        Not an admin? <a href="../login.html">User Login</a>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    function handleAdminLogin(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const submitBtn = event.target.querySelector("button[type='submit']");
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Logging in...';

      // Call the login but check for admin role
      handleLoginUser(email, password).finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Admin Login";
      });
    }
  </script>
</body>
</html>
