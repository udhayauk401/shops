<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed - DressLux</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="dashboard.html" class="navbar-logo">DressLux 👗</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="my-orders.html">My Orders</a></li>
        <li><a href="notifications.html">Notifications <span id="notification-count" class="notification-count hidden">0</span></a></li>
      </ul>

      <div class="navbar-icons">
        <a href="cart.html" class="navbar-icon-link" id="cart-link">
          🛒
          <span id="cart-count" class="cart-count">0</span>
        </a>
        <a href="#" class="navbar-icon-link" onclick="logoutUser(); return false;">👤</a>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Payment Success Page -->
  <div class="container">
    <div style="padding: 4rem 0; text-align: center;">
      <div style="font-size: 5rem; margin-bottom: 1rem; color: #388e3c;">✓</div>
      <h1 style="color: #388e3c; margin-bottom: 1rem;">Order Placed Successfully!</h1>
      <p style="font-size: 1.1rem; color: var(--gray); margin-bottom: 2rem;">Thank you for shopping with DressLux!</p>

      <div class="card" style="max-width: 600px; margin: 0 auto 2rem;">
        <h3 style="color: var(--primary); margin-bottom: 1rem;">Payment Method</h3>
        <p style="color: var(--dark); font-size: 1.1rem; margin: 0;">💳 Cash on Delivery</p>
        <p style="color: var(--gray); font-size: 0.95rem; margin: 0.5rem 0 0 0;">Pay when you receive your order</p>
      </div>

      <div id="order-summary" style="max-width: 600px; margin: 0 auto 2rem;">
        <!-- Order summary will be loaded here -->
      </div>

      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="my-orders.html" class="btn btn-primary">View My Orders</a>
        <a href="dashboard.html" class="btn btn-outline">Continue Shopping</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("active");
    });

    // Initialize page
    document.addEventListener("DOMContentLoaded", () => {
      requireAuth();
      initPaymentPage();
      updateCartBadge();
      updateNotificationBadge();
    });
  </script>
</body>
</html>
