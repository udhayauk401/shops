<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - DressLux</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="dashboard.html" class="navbar-logo">DressLux 👗</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="my-orders.html">My Orders</a></li>
        <li><a href="notifications.html" class="active">Notifications</a></li>
      </ul>

      <div class="navbar-icons">
        <a href="cart.html" class="navbar-icon-link" id="cart-link">
          🛒
          <span id="cart-count" class="cart-count">0</span>
        </a>
        <a href="#" class="navbar-icon-link" onclick="logoutUser(); return false;">👤</a>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Notifications Page -->
  <div class="container">
    <div style="padding: 2rem 0;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1 style="margin: 0;">Notifications</h1>
        <button id="mark-all-read-btn" class="btn btn-small btn-outline">Mark All as Read</button>
      </div>
      <div id="notifications-container">
        <!-- Notifications will be rendered here -->
        <div class="empty-state">
          <p>Loading notifications...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/notifications.js"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("active");
    });

    // Initialize page
    document.addEventListener("DOMContentLoaded", initNotificationsPage);
  </script>
</body>
</html>
