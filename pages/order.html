<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order - DressLux</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/cart.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-content">
      <a href="dashboard.html" class="navbar-logo">DressLux 👗</a>

      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <ul class="navbar-menu" id="navbar-menu">
        <li><a href="dashboard.html">Home</a></li>
        <li><a href="my-orders.html">My Orders</a></li>
        <li><a href="notifications.html">Notifications <span id="notification-count" class="notification-count hidden">0</span></a></li>
      </ul>

      <div class="navbar-icons">
        <a href="cart.html" class="navbar-icon-link" id="cart-link">
          🛒
          <span id="cart-count" class="cart-count">0</span>
        </a>
        <a href="#" class="navbar-icon-link" onclick="logoutUser(); return false;">👤</a>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Order Page -->
  <div class="container">
    <div class="cart-container" style="grid-template-columns: 1fr 350px;">
      <div class="cart-items">
        <h1>Delivery Details</h1>

        <form id="order-form" class="auth-form" style="margin-top: 2rem;">
          <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" placeholder="10-digit phone number" required>
          </div>

          <div class="form-group">
            <label for="address">Street Address *</label>
            <input type="text" id="address" placeholder="House no., street name" required>
          </div>

          <div class="form-group">
            <label for="city">City *</label>
            <input type="text" id="city" placeholder="Enter city name" required>
          </div>

          <div class="form-group">
            <label for="pincode">Pincode *</label>
            <input type="text" id="pincode" placeholder="6-digit pincode" required>
          </div>

          <div class="form-group">
            <label>Payment Method</label>
            <div class="radio-group">
              <label style="display: flex; align-items: center; margin: 0;">
                <input type="radio" name="payment" value="cod" checked required>
                <span style="margin-left: 0.5rem;">Cash on Delivery (COD)</span>
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn" style="width: 100%; margin-top: 2rem;">Place Order</button>
          <a href="cart.html" class="btn btn-outline" style="width: 100%; text-align: center; margin-top: 0.5rem;">Back to Cart</a>
        </form>
      </div>

      <div id="order-summary-container">
        <!-- Order summary will be rendered here -->
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/orders.js"></script>
  <script>
    // Mobile menu toggle
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("navbar-menu");

    hamburger.addEventListener("click", () => {
      hamburger.classList.toggle("active");
      menu.classList.toggle("active");
    });

    // Initialize page
    document.addEventListener("DOMContentLoaded", initOrderPage);
  </script>
</body>
</html>
